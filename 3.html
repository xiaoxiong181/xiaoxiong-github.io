          content: `
          <h2>引言</h2>
          <p>CSS Grid 布局是近年来前端领域最具革命性的特性之一。它为我们提供了一种二维布局系统，让复杂的页面布局变得简单而优雅。本文将深入探讨 CSS Grid 的高级技巧，帮助你掌握这个强大的布局工具。</p>

          <h2>基础概念回顾</h2>
          <p>在深入高级技巧之前，让我们先简单回顾一下 CSS Grid 的基础概念：</p>
          <ul>
            <li><strong>网格容器（Grid Container）</strong>：应用了 <code>display: grid</code> 的元素</li>
            <li><strong>网格项（Grid Item）</strong>：网格容器的直接子元素</li>
            <li><strong>网格线（Grid Line）</strong>：构成网格结构的分界线</li>
            <li><strong>网格轨道（Grid Track）</strong>：两条相邻网格线之间的空间</li>
            <li><strong>网格区域（Grid Area）</strong>：四条网格线包围的空间</li>
          </ul>

          <h2>高级技巧一：命名网格线</h2>
          <p>命名网格线可以让我们的代码更加语义化和易于维护。考虑以下示例：</p>
          <pre><code class="language-css">.container {
  display: grid;
  grid-template-columns: [sidebar-start] 200px [sidebar-end content-start] 1fr [content-end];
  grid-template-rows: [header-start] 80px [header-end main-start] 1fr [main-end footer-start] 60px [footer-end];
}

.header {
  grid-column: sidebar-start / content-end;
  grid-row: header-start / header-end;
}</code></pre>

          <h2>高级技巧二：隐式网格与网格自动放置</h2>
          <p>当网格项超出显式定义的网格时，CSS Grid 会自动创建隐式网格轨道。我们可以通过 <code>grid-auto-rows</code> 和 <code>grid-auto-columns</code> 来控制这些隐式轨道的尺寸：</p>
          <pre><code class="language-css">.grid-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: minmax(100px, auto);
  gap: 20px;
}</code></pre>

          <pre><code class="language-css">.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);

  transition: transform 0.3s ease;
}

.card:hover {

}</code></pre>

          content: `
          <h2>为什么需要响应式设计？</h2>
          <p>在多设备时代，用户可能通过手机、平板、笔记本、台式机甚至智能电视访问你的网站。响应式设计确保无论屏幕大小如何，用户都能获得最佳体验。</p>

          <h2>移动优先策略</h2>
          <p>移动优先意味着从最小屏幕开始设计，然后逐步增强到大屏幕。这种方法有以下优势：</p>
          <ul>
            <li>确保核心内容在所有设备上都能正常显示</li>

          <p>结合 CSS Grid 和 Flexbox 可以创建灵活的布局系统：</p>
          <pre><code class="language-css">/* 移动优先的响应式布局 */
.container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}

@media (min-width: 768px) {
  .container {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (min-width: 1024px) {
  .container {
    grid-template-columns: repeat(3, 1fr);
  }
}</code></pre>

          <h2>渲染优化</h2>
          <p>避免强制同步布局（Forced Synchronous Layout）是提升渲染性能的关键：</p>
          <pre><code class="language-javascript">// 不好的做法：强制同步布局
function badLayout() {
  const width = element.offsetWidth; // 读取
  element.style.width = width + 10 + 'px'; // 写入
  const height = element.offsetHeight; // 再次读取（强制布局）
  element.style.height = height + 10 + 'px'; // 再次写入
}

// 好的做法：批量读写
function goodLayout() {
  // 读取阶段
  const width = element.offsetWidth;
  const height = element.offsetHeight;
  
  // 写入阶段
  element.style.width = width + 10 + 'px';
  element.style.height = height + 10 + 'px';
}</code></pre>

    this.cache = new Map();
  }
  
  addData(id, data) {
    this.cache.set(id, data);
  }
  
  removeData(id) {
    this.cache.delete(id); // 及时清理
  }
  
  clear() {
    this.cache.clear(); // 清空所有引用
  }
}</code></pre>

          <h2>Web Workers 优化计算密集型任务</h2>

          <pre><code class="language-javascript">// main.js
const worker = new Worker('worker.js');

worker.postMessage({ cmd: 'calculate', data: largeDataSet });

worker.onmessage = (e) => {
  console.log('计算结果：', e.data.result);
};

// worker.js
self.onmessage = (e) => {
  if (e.data.cmd === 'calculate') {
    const result = performComplexCalculation(e.data.data);
    self.postMessage({ result });
  }
};</code></pre>

        },
      ];

      let currentArticleIndex = 0;

      /* ========== 移动端菜单切换 ========== */
      const menuBtn = document.getElementById("menuBtn");
      const navMenu = document.getElementById("navMenu");
      menuBtn.addEventListener("click", () => {
        navMenu.classList.toggle("active");
        menuBtn.textContent = navMenu.classList.contains("active") ? "✕" : "☰";
      });

      /* ========== 渲染文章 ========== */
      function renderArticle(index) {
        const article = articles[index];
        document.getElementById("articleTitle").textContent = article.title;
        document.getElementById("publishDate").textContent =
          article.publishDate;
        document.getElementById("updateDate").textContent = article.updateDate;
        document.getElementById("categoryTag").textContent = article.category;
        document.getElementById("tag").textContent = article.tag;
        document.getElementById("articleContent").innerHTML = article.content;

        // 更新上一篇/下一篇
        const prevLink = document.getElementById("prevLink");
        const nextLink = document.getElementById("nextLink");

        if (index === 0) {
          prevLink.style.visibility = "hidden";
        } else {
          prevLink.style.visibility = "visible";
          prevLink.onclick = (e) => {
            e.preventDefault();
            currentArticleIndex--;
            renderArticle(currentArticleIndex);
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
          prevLink.textContent = `← 上一篇：${articles[index - 1].title}`;
        }

        if (index === articles.length - 1) {
          nextLink.style.visibility = "hidden";
        } else {
          nextLink.style.visibility = "visible";
          nextLink.onclick = (e) => {
            e.preventDefault();
            currentArticleIndex++;
            renderArticle(currentArticleIndex);
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
          nextLink.textContent = `下一篇：${articles[index + 1].title} →`;
        }

        // 重新高亮代码
        Prism.highlightAll();
        // 重新加载评论
        loadComments();
      }

      /* ========== 分享功能 ========== */
      function shareToWeibo() {
        const title = articles[currentArticleIndex].title;
        const url = window.location.href;
        window.open(
          `https://service.weibo.com/share/share.php?title=${encodeURIComponent(
            title
          )}&url=${encodeURIComponent(url)}`
        );
      }

      function shareToWechat() {
        alert("请使用微信扫一扫功能分享本文链接");
      }

      function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert("链接已复制到剪贴板！");
        });
      }

      /* ========== 评论功能 ========== */
      function loadComments() {
        const articleId = articles[currentArticleIndex].id;
        const comments = JSON.parse(
          localStorage.getItem(`comments_${articleId}`) || "[]"
        );
        const commentList = document.getElementById("commentList");
        commentList.innerHTML = "";
        comments.forEach((comment) => renderComment(comment));
      }

      function renderComment(comment) {
        const commentList = document.getElementById("commentList");
        const item = document.createElement("div");
        item.className = "comment-item";
        item.innerHTML = `
        <div class="comment-main">
          <div class="comment-header">
            <span class="comment-author">${comment.name} ${
          comment.email ? `<small>(${comment.email})</small>` : ""
        }</span>
            <span class="comment-date">${comment.time}</span>
          </div>
          <div class="comment-content">${comment.content}</div>
          <div class="comment-actions">
            <button class="delete-btn" onclick="deleteComment('${
              comment.id
            }')">删除</button>
          </div>
        </div>
        <div class="like-wrap ${
          comment.liked ? "liked" : ""
        }" onclick="toggleLike('${comment.id}')">
          <span>👍</span>
          <span class="like-count">${comment.likes || 0}</span>
        </div>
      `;
        commentList.appendChild(item);
      }

      function toggleLike(commentId) {
        const articleId = articles[currentArticleIndex].id;
        const comments = JSON.parse(
          localStorage.getItem(`comments_${articleId}`) || "[]"
        );
        const comment = comments.find((c) => c.id === commentId);
        if (comment) {
          comment.liked = !comment.liked;
          comment.likes = (comment.likes || 0) + (comment.liked ? 1 : -1);
          localStorage.setItem(
            `comments_${articleId}`,
            JSON.stringify(comments)
          );
          loadComments();
        }
      }

      function deleteComment(commentId) {
        if (!confirm("确定要删除这条评论吗？")) return;
        const articleId = articles[currentArticleIndex].id;
        let comments = JSON.parse(
          localStorage.getItem(`comments_${articleId}`) || "[]"
        );
        comments = comments.filter((c) => c.id !== commentId);
        localStorage.setItem(`comments_${articleId}`, JSON.stringify(comments));
        loadComments();
        alert("评论已删除");
      }

      function submitComment(event) {
        event.preventDefault();
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const content = document.getElementById("content").value.trim();
        if (!name || !content) return;

        const articleId = articles[currentArticleIndex].id;
        const comments = JSON.parse(
          localStorage.getItem(`comments_${articleId}`) || "[]"
        );
        const newComment = {
          id: Date.now().toString(),
          name,
          email,
          content,
          time: new Date().toLocaleString(),
          likes: 0,
          liked: false,
        };
        comments.unshift(newComment);
        localStorage.setItem(`comments_${articleId}`, JSON.stringify(comments));

        // 发送到邮箱（模拟）
        const subject = `新评论：${articles[currentArticleIndex].title}`;
        const body = `姓名：${name}%0A邮箱：${email}%0A内容：${content}`;
        console.log(
          `mailto:your_email@example.com?subject=${encodeURIComponent(
            subject
          )}&body=${encodeURIComponent(body)}`
        );

        renderComment(newComment);
        event.target.reset();
        alert("评论发表成功！");
      }

      /* ========== 初始化 ========== */
      renderArticle(currentArticleIndex);
    </script>
  </body>
